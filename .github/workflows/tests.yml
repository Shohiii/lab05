name: Lab05 Tests and Coverage

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr

      - name: Configure
        run: |
          cmake -S . -B build \
            -DBUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build -j2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Show coverage
        run: |
          gcovr \
            --root . \
            --filter 'banking/.*' \
            --exclude 'third-party/.*' \
            --exclude 'tests/.*' \
            --txt
